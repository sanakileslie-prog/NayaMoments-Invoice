<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Naya Moments — Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF8F4;
  --surface: #ffffff;
  --surface2: #F5F2EC;
  --border: #E8E2D6;
  --text: #111111;
  --text2: #5a5040;
  --text3: #a89880;
  --accent: #B8973A;
  --accent-dark: #8a6e27;
  --accent-light: #FBF6EA;
  --input-bg: #ffffff;
  --input-border: #D9D2C4;
  --btn-danger: #c0392b;
  --shadow: 0 2px 16px rgba(180,150,60,0.07);
  --shadow-lg: 0 8px 40px rgba(180,150,60,0.13);
  --radius: 8px;
  --radius-lg: 14px;
}
[data-theme="dark"] {
  --bg: #0e0c09;
  --surface: #1a1710;
  --surface2: #221f17;
  --border: #2e2a1f;
  --text: #f0ead8;
  --text2: #c0b090;
  --text3: #6b5f45;
  --accent: #C9A84C;
  --accent-dark: #a07c2a;
  --accent-light: #1e1a0e;
  --input-bg: #1a1710;
  --input-border: #2e2a1f;
  --btn-danger: #e74c3c;
  --shadow: 0 2px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
.topbar-brand { display: flex; align-items: center; gap: 14px; }
.topbar-logo { height: 48px; width: 48px; object-fit: contain; border-radius: 4px; }
.topbar-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: 0.06em; }
.topbar-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 1px; }
.topbar-controls { display: flex; align-items: center; gap: 10px; }

.theme-toggle {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 30px; padding: 5px 14px; cursor: pointer;
  font-size: 12px; color: var(--text2); transition: all 0.2s;
  font-family: 'Jost', sans-serif;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

.currency-select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px;
  color: var(--text); font-family: 'Jost', sans-serif; cursor: pointer;
}
.currency-select:focus { outline: none; border-color: var(--accent); }

.container { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px 32px;
  box-shadow: var(--shadow); margin-bottom: 20px;
}

.section-label {
  font-family: 'Jost', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }
.field input, .field textarea, .field select {
  background: var(--input-bg); border: 1px solid var(--input-border);
  border-radius: var(--radius); padding: 9px 12px; font-size: 13px;
  color: var(--text); font-family: 'Jost', sans-serif;
  transition: border-color 0.2s; width: 100%;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(185,151,58,0.1);
}
.field textarea { resize: vertical; min-height: 62px; }

.items-header {
  display: grid;
  grid-template-columns: 2fr 70px 130px 100px 36px;
  gap: 8px; padding: 0 4px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.items-header span:nth-child(2), .items-header span:nth-child(3) { text-align: right; }

.item-row {
  display: grid;
  grid-template-columns: 2fr 70px 130px 100px 36px;
  gap: 8px; align-items: center; padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.item-row input {
  background: var(--input-bg); border: 1px solid var(--input-border);
  border-radius: 6px; padding: 7px 10px; font-size: 13px;
  color: var(--text); font-family: 'Jost', sans-serif; width: 100%;
  transition: border-color 0.2s;
}
.item-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(185,151,58,0.1); }

.item-total { text-align: right; font-size: 13px; font-weight: 600; color: var(--text); padding-right: 4px; }

.remove-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 18px; line-height: 1;
  width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.remove-btn:hover { background: #fdecea; color: var(--btn-danger); }

.add-item-btn {
  margin-top: 10px; width: 100%; padding: 9px;
  border: 1.5px dashed var(--border); border-radius: var(--radius);
  background: transparent; color: var(--accent);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; font-family: 'Jost', sans-serif; letter-spacing: 0.06em;
}
.add-item-btn:hover { border-color: var(--accent); background: var(--accent-light); }

.total-bar {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 16px; padding: 16px 4px 0; margin-top: 4px;
}
.total-label { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.total-amount { font-size: 22px; font-weight: 600; color: var(--accent); font-family: 'Cormorant Garamond', serif; }

.action-row { display: flex; gap: 12px; }
.btn-clear {
  flex: 1; padding: 12px; border: 1px solid var(--border);
  background: transparent; border-radius: var(--radius);
  font-size: 13px; color: var(--text2); cursor: pointer;
  font-family: 'Jost', sans-serif; transition: all 0.2s; letter-spacing: 0.04em;
}
.btn-clear:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.btn-generate {
  flex: 2; padding: 12px; background: var(--accent);
  border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
  font-family: 'Jost', sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  transition: all 0.2s; box-shadow: 0 4px 16px rgba(185,151,58,0.3);
}
.btn-generate:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 6px 22px rgba(185,151,58,0.4); }
.btn-generate:active { transform: translateY(0); }

#preview-section { display: none; }
.preview-actions { display: flex; gap: 10px; margin-bottom: 20px; }
.btn-back {
  padding: 9px 20px; border: 1px solid var(--border);
  background: var(--surface); border-radius: var(--radius);
  font-size: 12px; color: var(--text2); cursor: pointer;
  font-family: 'Jost', sans-serif; transition: all 0.2s; letter-spacing: 0.04em;
}
.btn-back:hover { border-color: var(--accent); color: var(--accent); }
.btn-print {
  padding: 9px 24px; background: var(--accent); border: none;
  border-radius: var(--radius); font-size: 12px; font-weight: 600;
  color: #fff; cursor: pointer; font-family: 'Jost', sans-serif;
  transition: all 0.2s; letter-spacing: 0.06em; text-transform: uppercase;
}
.btn-print:hover { background: var(--accent-dark); }

.invoice-paper {
  background: #fff; color: #111;
  padding: 52px 56px; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  font-family: 'Jost', sans-serif;
}

.inv-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 22px; border-bottom: 2px solid #111; margin-bottom: 32px; }
.inv-title-block .inv-type { font-family: 'Cormorant Garamond', serif; font-size: 38px; line-height: 1; color: #111; font-weight: 600; letter-spacing: 0.04em; }
.inv-title-block .inv-subtitle { font-size: 11px; color: #888; margin-top: 5px; letter-spacing: 0.14em; text-transform: uppercase; }
.inv-logo-block img { height: 80px; object-fit: contain; }

.inv-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
.inv-to-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 5px; }
.inv-to-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: #111; }
.inv-to-addr { font-size: 12px; color: #666; margin-top: 4px; white-space: pre-line; line-height: 1.7; }
.inv-details-block { font-size: 12px; color: #555; line-height: 2.1; }
.inv-details-block .row { display: flex; gap: 8px; }
.inv-details-block .dlabel { color: #999; min-width: 110px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.inv-details-block .dval { color: #111; font-weight: 500; }

.inv-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
.inv-table thead tr { background: #FAF8F4; }
.inv-table th { font-size: 10px; font-weight: 600; padding: 11px 14px; color: #B8973A; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1.5px solid #B8973A; }
.inv-table th:nth-child(2) { text-align: center; }
.inv-table th:last-child { text-align: right; }
.inv-table td { font-size: 12px; padding: 11px 14px; border-bottom: 1px solid #EDE8DF; color: #333; }
.inv-table td:nth-child(2) { text-align: center; }
.inv-table td:last-child { text-align: right; font-weight: 600; }
.inv-table tr:nth-child(even) td { background: #FDFBF7; }

.inv-total-section { display: flex; justify-content: flex-end; padding: 14px 14px 0; border-top: 1.5px solid #111; margin-top: 4px; }
.inv-total-inner .tlabel { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
.inv-total-inner .tval { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: #111; margin-top: 2px; }

.inv-payment-section { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 36px; padding-top: 24px; border-top: 1px solid #EDE8DF; }
.inv-pay-title { font-size: 10px; font-weight: 700; color: #B8973A; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.inv-pay-detail { font-size: 12px; color: #555; line-height: 2; }

.inv-tagline { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #EDE8DF; font-family: 'Cormorant Garamond', serif; font-size: 14px; color: #B8973A; letter-spacing: 0.08em; font-style: italic; }

@page { size: A4; margin: 16mm 14mm; }
@media print {
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
  body * { visibility: hidden; }
  .invoice-paper, .invoice-paper * { visibility: visible; }
  .invoice-paper {
    position: absolute; top: 0; left: 0; width: 100%;
    box-shadow: none; border: none; border-radius: 0; padding: 0; margin: 0;
  }
  .topbar, .preview-actions { display: none !important; }
  .inv-table { page-break-inside: auto; }
  .inv-table tr { page-break-inside: avoid; page-break-after: auto; }
}
@media (max-width: 640px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
  .items-header { display: none; }
  .item-row { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; }
  .item-row input:nth-child(1) { grid-column: 1/-1; }
  .card { padding: 18px 16px; }
  .container { padding: 16px 10px 60px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <img class="topbar-logo" id="topbar-logo" src="" alt="Naya Moments" />
    <div>
      <div class="topbar-name">Naya Moments</div>
      <div class="topbar-sub">Event Planning, Curation &amp; Décor · Invoice Generator</div>
    </div>
  </div>
  <div class="topbar-controls">
    <select class="currency-select" id="currency-sel" onchange="setCurrency(this.value)">
      <option value="GHS" selected>🇬🇭 GHS — Ghana Cedi</option>
      <option value="USD">🇺🇸 USD — US Dollar</option>
      <option value="EUR">🇪🇺 EUR — Euro</option>
      <option value="GBP">🇬🇧 GBP — British Pound</option>
      <option value="NGN">🇳🇬 NGN — Nigerian Naira</option>
      <option value="ZAR">🇿🇦 ZAR — South African Rand</option>
    </select>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>
  </div>
</div>

<div class="container">

  <div id="form-section">

    <div class="card">
      <div class="section-label">Invoice Details</div>
      <div class="three-col" style="margin-bottom:14px">
        <div class="field">
          <label>Invoice Type</label>
          <select id="inv-type">
            <option value="PRO FORMA INVOICE">Pro Forma Invoice</option>
            <option value="TAX INVOICE">Tax Invoice</option>
            <option value="INVOICE">Invoice</option>
          </select>
        </div>
        <div class="field">
          <label>Invoice Number</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="text" id="inv-num" placeholder="Auto-generated" style="flex:1" />
            <button onclick="generateInvNum()" title="Generate new code" style="background:var(--accent-light);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;color:var(--accent);white-space:nowrap">↺</button>
          </div>
        </div>
        <div class="field">
          <label>Invoice Date</label>
          <input type="date" id="inv-date" />
        </div>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Due Date (optional)</label>
          <input type="date" id="due-date" />
        </div>
        <div class="field">
          <label>Notes / Terms (optional)</label>
          <input type="text" id="inv-notes" placeholder="e.g. Payment within 7 days" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Bill To</div>
      <div class="two-col">
        <div class="field">
          <label>Client / Company Name</label>
          <input type="text" id="client-name" placeholder="e.g. Acme Ltd" />
        </div>
        <div class="field">
          <label>Client Address (optional)</label>
          <textarea id="client-addr" placeholder="Street, City, Region"></textarea>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Line Items</div>
      <div class="items-header">
        <span>Description</span>
        <span>Qty</span>
        <span style="text-align:right">Unit Price (<span class="cur-label">GHS</span>)</span>
        <span style="text-align:right">Total (<span class="cur-label">GHS</span>)</span>
        <span></span>
      </div>
      <div id="items-container"></div>
      <button class="add-item-btn" onclick="addRow()">+ Add Line Item</button>
      <div class="total-bar">
        <span class="total-label">Total</span>
        <span class="total-amount" id="grand-total">GHS 0.00</span>
      </div>
    </div>

    <div class="card" style="padding:18px 24px">
      <div class="section-label">Discount</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:180px">
          <label>Discount (%)</label>
          <input type="number" id="discount-pct" min="0" max="100" step="0.01" placeholder="0.00" oninput="updateTotals()" style="max-width:180px" />
        </div>
        <div id="discount-preview" style="font-size:13px;color:var(--text2);margin-top:18px"></div>
      </div>
    </div>

    <div class="card" style="padding:18px 24px">
      <div class="section-label">Ghana Tax</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
          <input type="checkbox" id="vat-enabled" onchange="updateTotals()" style="width:15px;height:15px;cursor:pointer;accent-color:var(--accent)" />
          VAT (15%)
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
          <input type="checkbox" id="nhil-enabled" onchange="updateTotals()" style="width:15px;height:15px;cursor:pointer;accent-color:var(--accent)" />
          NHIL (2.5%)
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
          <input type="checkbox" id="getfund-enabled" onchange="updateTotals()" style="width:15px;height:15px;cursor:pointer;accent-color:var(--accent)" />
          GETFund (2.5%)
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text)">
          <input type="checkbox" id="covid-enabled" onchange="updateTotals()" style="width:15px;height:15px;cursor:pointer;accent-color:var(--accent)" />
          COVID-19 Levy (1%)
        </label>
      </div>
      <div id="tax-preview" style="font-size:12px;color:var(--text2);margin-top:6px"></div>
    </div>

    <div class="card">
      <div class="action-row">
        <button class="btn-clear" onclick="clearForm()">Clear Form</button>
        <button class="btn-generate" onclick="generateInvoice()">Generate Invoice →</button>
      </div>
    </div>

  </div>

  <div id="preview-section">
    <div class="preview-actions">
      <button class="btn-back" onclick="goBack()">← Back to Editor</button>
      <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
    <div class="invoice-paper" id="invoice-paper"></div>
  </div>

</div>

const CURRENCIES = {
  GHS: { symbol: 'GHS' }, USD: { symbol: 'USD' }, EUR: { symbol: 'EUR' },
  GBP: { symbol: 'GBP' }, NGN: { symbol: 'NGN' }, ZAR: { symbol: 'ZAR' },
};
let currentCurrency = 'GHS';
let items = [];
let isDark = true;

document.getElementById('topbar-logo').src = 'data:image/jpeg;base64,' + LOGO_B64;
document.getElementById('inv-date').value = new Date().toISOString().split('T')[0];

function getNextInvNum() {
  const year = new Date().getFullYear().toString().slice(-2);
  const stored = localStorage.getItem('naya_inv_counter');
  const counter = stored ? parseInt(stored) + 1 : 100;
  localStorage.setItem('naya_inv_counter', counter);
  return 'NM' + counter + '-' + year;
}
function generateInvNum() {
  document.getElementById('inv-num').value = getNextInvNum();
}
generateInvNum();

function setCurrency(val) {
  currentCurrency = val;
  document.querySelectorAll('.cur-label').forEach(el => el.textContent = val);
  renderItems();
}

function toggleTheme() {
  isDark = !isDark;
  document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}

function fmt(n) {
  const num = parseFloat(n) || 0;
  return currentCurrency + ' ' + num.toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) {
  const num = parseFloat(n) || 0;
  return num.toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '--';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function addRow(desc = '', qty = 1, price = '') {
  const id = Date.now() + Math.random();
  items.push({ id, desc, qty, price });
  renderItems();
}

function removeRow(id) {
  items = items.filter(i => i.id !== id);
  renderItems();
}

function renderItems() {
  const container = document.getElementById('items-container');
  container.innerHTML = '';
  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const descInput = document.createElement('input');
    descInput.type = 'text';
    descInput.value = item.desc;
    descInput.placeholder = 'Description';
    descInput.addEventListener('input', function() { items[idx].desc = this.value; });

    const qtyInput = document.createElement('input');
    qtyInput.type = 'text';
    qtyInput.value = item.qty;
    qtyInput.placeholder = '1';
    qtyInput.style.textAlign = 'center';
    qtyInput.addEventListener('input', function() { items[idx].qty = this.value; updateTotals(); });

    const priceInput = document.createElement('input');
    priceInput.type = 'text';
    priceInput.value = item.price;
    priceInput.placeholder = '0.00';
    priceInput.style.textAlign = 'right';
    priceInput.addEventListener('input', function() { items[idx].price = this.value; updateTotals(); });

    const totalDiv = document.createElement('div');
    totalDiv.className = 'item-total';
    totalDiv.id = 'row-total-' + idx;
    const t = (parseFloat(item.qty)||0) * (parseFloat(item.price)||0);
    totalDiv.textContent = fmtNum(t);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.title = 'Remove';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', function() { removeRow(item.id); });

    row.appendChild(descInput);
    row.appendChild(qtyInput);
    row.appendChild(priceInput);
    row.appendChild(totalDiv);
    row.appendChild(removeBtn);
    container.appendChild(row);
  });
  updateTotals();
}

function getTaxAmounts(subtotal) {
  const vatAmt     = document.getElementById('vat-enabled')?.checked     ? subtotal * 0.15  : 0;
  const nhilAmt    = document.getElementById('nhil-enabled')?.checked    ? subtotal * 0.025 : 0;
  const getfundAmt = document.getElementById('getfund-enabled')?.checked ? subtotal * 0.025 : 0;
  const covidAmt   = document.getElementById('covid-enabled')?.checked   ? subtotal * 0.01  : 0;
  return { vatAmt, nhilAmt, getfundAmt, covidAmt };
}

function getDiscountAmount(subtotal) {
  const pct = parseFloat(document.getElementById('discount-pct')?.value) || 0;
  return subtotal * Math.min(Math.max(pct, 0), 100) / 100;
}

function updateTotals() {
  let subtotal = 0;
  items.forEach((item, idx) => {
    const t = (parseFloat(item.qty)||0) * (parseFloat(item.price)||0);
    subtotal += t;
    const el = document.getElementById('row-total-' + idx);
    if (el) el.textContent = fmtNum(t);
  });
  const discountAmt = getDiscountAmount(subtotal);
  const discountedSubtotal = subtotal - discountAmt;
  const discPreview = document.getElementById('discount-preview');
  if (discPreview) {
    const pct = parseFloat(document.getElementById('discount-pct')?.value) || 0;
    discPreview.textContent = pct > 0 ? 'Discount (' + pct + '%): −' + fmt(discountAmt) + '  →  After discount: ' + fmt(discountedSubtotal) : '';
  }
  const { vatAmt, nhilAmt, getfundAmt, covidAmt } = getTaxAmounts(discountedSubtotal);
  const totalTax = vatAmt + nhilAmt + getfundAmt + covidAmt;
  const grand = discountedSubtotal + totalTax;
  const preview = document.getElementById('tax-preview');
  if (preview) {
    const parts = [];
    if (vatAmt)     parts.push('VAT: ' + fmt(vatAmt));
    if (nhilAmt)    parts.push('NHIL: ' + fmt(nhilAmt));
    if (getfundAmt) parts.push('GETFund: ' + fmt(getfundAmt));
    if (covidAmt)   parts.push('COVID-19: ' + fmt(covidAmt));
    preview.textContent = parts.length ? parts.join('  |  ') + '  →  Total: ' + fmt(grand) : '';
  }
  document.getElementById('grand-total').textContent = fmt(grand);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function clearForm() {
  items = [];
  renderItems();
  const discEl = document.getElementById('discount-pct'); if (discEl) discEl.value = '';
  const discPrev = document.getElementById('discount-preview'); if (discPrev) discPrev.textContent = '';
  ['inv-date','due-date','client-name','client-addr','inv-notes'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('inv-date').value = new Date().toISOString().split('T')[0];
  generateInvNum();
  document.getElementById('inv-type').value = 'PRO FORMA INVOICE';
  ['vat-enabled','nhil-enabled','getfund-enabled','covid-enabled'].forEach(id=>{const el=document.getElementById(id);if(el)el.checked=false;});
  const tp=document.getElementById('tax-preview');if(tp)tp.textContent='';
}

function generateInvoice() {
  const invType = document.getElementById('inv-type').value;
  const invNum = document.getElementById('inv-num').value || '--';
  const invDate = document.getElementById('inv-date').value;
  const dueDate = document.getElementById('due-date').value;
  const clientName = document.getElementById('client-name').value || '[Client Name]';
  const clientAddr = document.getElementById('client-addr').value || '';
  const notes = document.getElementById('inv-notes').value || '';
  const subtotal = items.reduce((s, i) => s + (parseFloat(i.qty)||0) * (parseFloat(i.price)||0), 0);
  const discountPct = parseFloat(document.getElementById('discount-pct')?.value) || 0;
  const discountAmt = subtotal * Math.min(Math.max(discountPct, 0), 100) / 100;
  const discountedSubtotal = subtotal - discountAmt;
  const { vatAmt, nhilAmt, getfundAmt, covidAmt } = getTaxAmounts(discountedSubtotal);
  const totalTax = vatAmt + nhilAmt + getfundAmt + covidAmt;
  const grand = discountedSubtotal + totalTax;
  const cur = currentCurrency;

  const rows = items.map((item, i) => {
    const tot = (parseFloat(item.qty)||0) * (parseFloat(item.price)||0);
    const bg = i % 2 === 1 ? 'background:#FDFBF7' : '';
    return `<tr>
      <td style="${bg}">${escHtml(item.desc) || '—'}</td>
      <td style="text-align:center;${bg}">${item.qty}</td>
      <td style="text-align:right;${bg}">${fmtNum(item.price)}</td>
      <td style="text-align:right;font-weight:600;${bg}">${fmtNum(tot)}</td>
    </tr>`;
  }).join('');

  document.getElementById('invoice-paper').innerHTML = `
    <div class="inv-header">
      <div class="inv-title-block">
        <div class="inv-type">${invType}</div>
        <div class="inv-subtitle">Naya Moments</div>
        <div style="font-size:10px;color:#aaa;letter-spacing:0.14em;text-transform:uppercase;margin-top:3px;">Event Planning, Curation &amp; Décor</div>
      </div>
      <div class="inv-logo-block">
        <img src="data:image/jpeg;base64,${LOGO_B64}" alt="Naya Moments" />
      </div>
    </div>

    <div class="inv-meta">
      <div>
        <div class="inv-to-label">Invoice To</div>
        <div class="inv-to-name">${escHtml(clientName)}</div>
        ${clientAddr ? `<div class="inv-to-addr">${escHtml(clientAddr)}</div>` : ''}
      </div>
      <div class="inv-details-block">
        <div class="row"><span class="dlabel">Invoice No</span><span class="dval">${escHtml(invNum)}</span></div>
        <div class="row"><span class="dlabel">Invoice Date</span><span class="dval">${fmtDate(invDate)}</span></div>
        <div class="row"><span class="dlabel">Due Date</span><span class="dval">${fmtDate(dueDate)}</span></div>
        <div class="row"><span class="dlabel">Currency</span><span class="dval">${cur}</span></div>
      </div>
    </div>

    <table class="inv-table">
      <thead>
        <tr>
          <th style="width:45%">Description</th>
          <th style="width:12%;text-align:center">Qty</th>
          <th style="width:22%;text-align:right">Unit Price (${cur})</th>
          <th style="width:21%;text-align:right">Total (${cur})</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="inv-total-section">
      <div class="inv-total-inner" style="text-align:right">
        ${(discountAmt > 0 || totalTax > 0) ? `
        <div style="font-size:12px;color:#777;margin-bottom:3px">Subtotal: ${cur} ${fmtNum(subtotal)}</div>
        ${discountAmt > 0 ? `<div style="font-size:12px;color:#c0392b;margin-bottom:3px">Discount (${discountPct}%): −${cur} ${fmtNum(discountAmt)}</div>` : ''}
        ${vatAmt     ? `<div style="font-size:12px;color:#777;margin-bottom:2px">VAT (15%): ${cur} ${fmtNum(vatAmt)}</div>` : ''}
        ${nhilAmt    ? `<div style="font-size:12px;color:#777;margin-bottom:2px">NHIL (2.5%): ${cur} ${fmtNum(nhilAmt)}</div>` : ''}
        ${getfundAmt ? `<div style="font-size:12px;color:#777;margin-bottom:2px">GETFund (2.5%): ${cur} ${fmtNum(getfundAmt)}</div>` : ''}
        ${covidAmt   ? `<div style="font-size:12px;color:#777;margin-bottom:6px">COVID-19 Levy (1%): ${cur} ${fmtNum(covidAmt)}</div>` : ''}
        ` : ''}
        <div class="tlabel">Total Amount</div>
        <div class="tval">${cur} ${fmtNum(grand)}</div>
      </div>
    </div>

    ${notes ? `<div style="margin-top:20px;padding:12px 16px;background:#FAF8F4;border-radius:8px;font-size:12px;color:#666;border-left:3px solid #B8973A"><strong style="color:#B8973A">Notes:</strong> ${escHtml(notes)}</div>` : ''}

    <div class="inv-payment-section">
      <div>
        <div class="inv-pay-title">Payment Details (Bank)</div>
        <div class="inv-pay-detail">
          Bank Name : <br>
          Account Holder : <br>
          Account Number : <br>
          Branch :
        </div>
      </div>
      <div>
        <div class="inv-pay-title">Payment Details (MoMo)</div>
        <div class="inv-pay-detail">
          MoMo Name : <br>
          MoMo Number :
        </div>
      </div>
    </div>

    <div class="inv-tagline">Thank you for choosing Naya Moments — crafting memories, one event at a time.</div>
  `;

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('preview-section').style.display = 'block';
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('preview-section').style.display = 'none';
  window.scrollTo(0, 0);
}

addRow('', 1, '');
</script>
</body>
</html>
